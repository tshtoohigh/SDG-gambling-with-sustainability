<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>shot harness</title>
<style>
  html,body{margin:0;padding:0;background:#fff;overflow:hidden}
  iframe{border:0;display:block}
</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
/* Screenshot harness: loads a page in a same-origin iframe, scrolls a chosen
   selector into view, then sits still so headless Chrome can capture it.
   Usage: shot.html?page=index.html&sel=%23try-the-wheel&w=1360&h=1000&pad=80 */
const q = new URLSearchParams(location.search);
const w = Number(q.get('w') || 1360);
const h = Number(q.get('h') || 900);
const pad = Number(q.get('pad') || 0);
const f = document.getElementById('f');
f.style.width = w + 'px';
f.style.height = h + 'px';
f.onload = () => {
  const doc = f.contentDocument;
  doc.documentElement.style.scrollBehavior = 'auto';
  const sel = q.get('sel');
  if (sel) {
    const el = doc.querySelector(sel);
    if (el) {
      const y = el.getBoundingClientRect().top + f.contentWindow.scrollY - pad;
      f.contentWindow.scrollTo(0, Math.max(0, y));
    }
  } else if (q.get('y')) {
    f.contentWindow.scrollTo(0, Number(q.get('y')));
  }
  /* Force scroll-reveal elements to their final state with no transition.
     Adding .is-in alone starts a 520ms transition that does not complete
     under Chrome's virtual time, which makes captures look washed out. */
  const s = doc.createElement('style');
  s.textContent = '.reveal{opacity:1 !important;transform:none !important;transition:none !important}';
  doc.head.appendChild(s);
};
f.src = q.get('page') || 'index.html';
</script>
</body>
</html>
