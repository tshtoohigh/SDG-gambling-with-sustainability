<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Second Spin — interaction test harness</title></head>
<body>
<h1>Results</h1>
<pre id="out">running…</pre>
<iframe id="frame" src="" style="width:1280px;height:900px;border:0"></iframe>

<script>
/* ==========================================================================
   Drives the real pages in same-origin iframes and asserts behaviour.

   Run against a served copy (same-origin iframes need HTTP, not file://):
     python3 -m http.server 8000
     chrome --headless --no-sandbox --force-prefers-reduced-motion \
       --virtual-time-budget=90000 --dump-dom \
       "http://localhost:8000/tests/interaction-test.html" | grep -E 'PASS|FAIL|TOTAL'

   --force-prefers-reduced-motion makes the reel resolve synchronously, which
   keeps assertions fast and deterministic.
   ========================================================================== */

const lines = [];
const out = () => { document.getElementById('out').textContent = lines.join('\n'); };
/* Flush after every assertion so a stall still shows how far we got. */
const log = (ok, msg) => { lines.push(`${ok ? 'PASS' : 'FAIL'}  ${msg}`); out(); };
const mark = (msg) => { lines.push(`---- ${msg}`); out(); };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function loadFrame(url) {
  return new Promise((resolve) => {
    const f = document.getElementById('frame');
    f.onload = () => setTimeout(() => resolve(f.contentWindow), 300);
    f.src = url;
  });
}

const RANK = { everyday: 1, seasonal: 2, statement: 3, designer: 4, rare: 5 };

async function run() {
  let win, doc;

  /* ==================================================================
     1. The reel renders, and its composition IS the published odds
     ================================================================== */
  mark('1. reel composition');
  win = await loadFrame('/box.html?tier=classic');
  doc = win.document;
  await sleep(300);

  const api = win.SecondSpin;
  log(!!api, 'window.SecondSpin exposed');
  const reel = api && api.reels[0];
  log(!!reel, 'reel instantiated on box.html');

  const cells = () => Array.from(doc.querySelectorAll('.reel__cell'));
  log(cells().length === 64, `strip has 64 cells (${cells().length})`);
  log(doc.querySelectorAll('.reel__img').length > 0, 'cells show real catalogue garment sprites');

  const tallyCells = () => cells().reduce((a, c) => {
    a[c.dataset.rarity] = (a[c.dataset.rarity] || 0) + 1; return a;
  }, {});
  const before = tallyCells();
  log(Object.values(before).reduce((a, b) => a + b, 0) === 64, 'cell counts total 64');

  /* THE load-bearing honesty invariant. */
  const classic = win.TIER_BY_ID ? win.TIER_BY_ID.classic : api.TIERS.find(t => t.id === 'classic');
  let proportional = true;
  const detail = [];
  Object.keys(before).forEach((k) => {
    const exact = (classic.odds[k] / 100) * 64;
    detail.push(`${k} ${before[k]}/${exact.toFixed(1)}`);
    if (Math.abs(before[k] - exact) > 1) proportional = false;
  });
  log(proportional, `every cell count within 1 of its exact published proportion (${detail.join(', ')})`);
  log(reel.counts.rare === 4, `6% Vintage Rare renders as 4 of 64 cells (${reel.counts.rare})`);

  /* ==================================================================
     2. Opening resolves a result
     ================================================================== */
  mark('2. opening');
  doc.querySelector('[data-reel-open]').click();
  await sleep(700);

  const won = doc.querySelector('.reel__cell.is-won');
  log(!!won, 'a winning cell is marked after opening');

  /* NO FAKE NEAR-MISS: winning cell centre must sit on the marker centre. */
  if (won) {
    const vp = doc.querySelector('[data-reel-viewport]').getBoundingClientRect();
    const wr = won.getBoundingClientRect();
    const drift = Math.abs((wr.left + wr.width / 2) - (vp.left + vp.width / 2));
    log(drift < 1.5,
        `winning cell lands DEAD CENTRE on the marker, drift ${drift.toFixed(2)}px — no manufactured near-miss`);
  }

  const result = doc.querySelector('[data-reel-result]');
  log(result.classList.contains('is-hit'), 'result panel populated');
  log(/chance/.test(result.textContent), 'result states the % chance of the outcome');
  log(/dead centre/i.test(result.textContent), 'result discloses the dead-centre landing');
  log(/assets\/items\/itm-\d{3}\.png/.test(result.innerHTML), 'result shows a real catalogue garment sprite');
  log(/lookbook\.html\?tag=/.test(result.innerHTML), 'result links through to the filtered lookbook');
  log(/Yours \/ ours/.test(doc.querySelector('[data-reel-tally]').textContent),
      'running tally rendered after opening');

  /* Composition must survive — the winner is swapped in, never injected */
  const after = tallyCells();
  const same = Object.keys(before).length === Object.keys(after).length &&
               Object.keys(before).every(k => before[k] === after[k]);
  log(same, 'composition preserved after opening (winner swapped, not injected)');

  log(/64 cells, apportioned/.test(doc.querySelector('[data-reel-composition]').textContent),
      'strip prints its own composition so it can be counted');

  /* ==================================================================
     3. Tier switching rebinds everything, including the reel
     ================================================================== */
  mark('3. tier switching');
  doc.querySelector('[data-tier-value="premium"]').click();
  await sleep(400);
  log(doc.querySelector('[data-tier-bind="price"]').textContent.trim() === '$45',
      `switching to Premium updates price ($45) -> ${doc.querySelector('[data-tier-bind="price"]').textContent.trim()}`);
  log(doc.querySelector('[data-tier-bind="standout"]').textContent.trim() === '100%',
      'Premium standout chance shows 100%');
  log(!cells().some(c => c.dataset.rarity === 'everyday'),
      'Premium strip contains zero Everyday cells, matching its published 0%');
  const addBtn = doc.querySelector('[data-product] [data-add-to-cart]');
  log(addBtn.dataset.addToCart === 'premium', 'add-to-cart repointed to premium');
  log(/Premium/.test(addBtn.textContent), 'add-to-cart label updated');
  log(doc.querySelectorAll('[data-slot-grid] .slot').length === 6, 'slot diagram shows 6 slots');
  log(doc.querySelectorAll('[data-slot-grid] .slot--feature').length === 2, '2 of them are feature slots');

  /* ==================================================================
     4. Odds modal
     ================================================================== */
  mark('4. odds modal');
  doc.querySelector('[data-odds-modal]').click();
  await sleep(300);
  const modal = doc.querySelector('.modal.is-open');
  log(!!modal, 'odds modal opens');
  if (modal) {
    const pcts = Array.from(modal.querySelectorAll('tbody tr td:last-child'))
      .map(td => parseFloat(td.textContent));
    const sum = pcts.reduce((a, b) => a + b, 0);
    log(Math.abs(sum - 100) < 0.01, `modal odds sum to 100% (${sum}%)`);
    log(/never/i.test(modal.textContent), 'modal discloses outcomes that never appear');
    log(/64 cells/.test(modal.textContent), 'modal explains the strip apportionment');
    modal.querySelector('[data-close]').click();
    await sleep(200);
    log(!doc.querySelector('.modal.is-open'), 'modal closes');
  }

  /* ==================================================================
     5. Cart
     ================================================================== */
  mark('5. cart');
  doc.querySelector('[data-product] [data-add-to-cart]').click();
  await sleep(300);
  log(doc.querySelector('[data-cart-count]').textContent === '1', 'cart badge shows 1');
  log(doc.querySelector('[data-cart-drawer]').classList.contains('is-open'), 'cart drawer opened');
  log(/\$45/.test(doc.querySelector('[data-cart-total]').textContent), 'cart total is $45');
  log(/6\.4 lbs/.test(doc.querySelector('[data-cart-lbs]').textContent), 'cart shows lbs rescued');
  doc.querySelector('[data-qty-up]').click();
  await sleep(250);
  log(/\$90/.test(doc.querySelector('[data-cart-total]').textContent), 'qty increment doubles total to $90');

  /* ==================================================================
     6. Trade Up
     ================================================================== */
  mark('6. trade up');
  win = await loadFrame('/box.html?tier=classic');
  doc = win.document;
  await sleep(300);
  const r2 = win.SecondSpin.reels[0];

  /* Force a known low outcome so the offer is guaranteed to appear. */
  const everyday = r2.pool.find(r => r.id === 'everyday');
  r2.recordResult(everyday, null);
  await sleep(150);

  const offer = doc.querySelector('[data-offer]');
  log(!!offer, 'offer appears after an Everyday Staple result');
  log(offer && /\$2\.20/.test(offer.textContent), 'fee shown as $2.20 (10% of $22)');
  log(offer && /Guaranteed upgrade/i.test(offer.textContent), 'states the guaranteed-upgrade floor');
  log(offer && /worst case is Seasonal Pick/i.test(offer.textContent), 'names the floor outcome correctly');
  if (offer) {
    const segs = Array.from(offer.querySelectorAll('.odds-bar__seg'));
    const total = segs.reduce((a, s) => a + parseFloat(s.style.width), 0);
    log(Math.abs(total - 100) < 0.05, `offered pool widths total 100% (${total.toFixed(1)}%)`);
    log(!segs.some(s => s.dataset.rarity === 'rare'), 'Vintage Rare absent from the offered pool');
  }

  doc.querySelector('[data-keep-it]').click();
  await sleep(150);
  log(!doc.querySelector('[data-offer]'), '"Keep it" dismisses the offer');

  r2.recordResult(everyday, null);
  await sleep(150);
  doc.querySelector('[data-trade-up]').click();
  await sleep(700);
  log(r2.tradeUps === 1, `trade counter incremented (${r2.tradeUps})`);
  log(Math.abs(r2.extraSpend - 2.2) < 0.001, `ledger charged $2.20 (${r2.extraSpend})`);
  log(RANK[r2.lastResult.id] > RANK.everyday,
      `result is a STRICT upgrade on Everyday (got ${r2.lastResult.label})`);
  log(r2.lastResult.id !== 'rare', 'result is never Vintage Rare');
  log(/Trade Up ledger/.test(doc.querySelector('[data-reel-result]').textContent),
      'running spend ledger is displayed');
  log(!cells().some(c => c.dataset.rarity === 'everyday'),
      'trade-up strip drops Everyday cells entirely');

  const seasonalNow = r2.pool.find(r => r.id === 'seasonal');
  if (seasonalNow) {
    r2.recordResult(seasonalNow, null);
    await sleep(150);
    const capped = doc.querySelector('[data-offer]');
    log(capped && /capped|already used/i.test(capped.textContent),
        'second trade on the same slot is refused by the cap');
    log(!doc.querySelector('[data-trade-up]'), 'no second trade-up button offered');
  }

  doc.querySelector('[data-reel-open]').click();
  await sleep(700);
  log(r2.poolFrom === null, 'opening again resets to base odds');
  log(r2.pool.length === 5, `base strip restored to 5 outcomes (${r2.pool.length})`);
  log(r2.tradeUps === 0 && r2.extraSpend === 0, 'ledger cleared on a fresh slot');

  /* ==================================================================
     7. Deep link
     ================================================================== */
  mark('7. deep link');
  win = await loadFrame('/box.html?tier=starter');
  doc = win.document;
  await sleep(300);
  log(doc.querySelector('[data-tier-bind="price"]').textContent.trim() === '$10',
      '?tier=starter applies Starter pricing');
  log(win.SecondSpin.reels[0].tier.id === 'starter', '?tier=starter switches the reel');
  log(win.SecondSpin.reels[0].counts.rare === 1,
      `Starter's 2% Vintage Rare renders as 1 of 64 cells (${win.SecondSpin.reels[0].counts.rare})`);

  /* ==================================================================
     8. Shop page
     ================================================================== */
  mark('8. shop page');
  win = await loadFrame('/shop.html');
  doc = win.document;
  await sleep(400);
  const bars = doc.querySelectorAll('[data-odds-bar]');
  log(bars.length === 3, `3 tier odds bars rendered (${bars.length})`);
  let widthsOk = true;
  bars.forEach((bar) => {
    const total = Array.from(bar.children).reduce((a, s) => a + parseFloat(s.style.width), 0);
    if (Math.abs(total - 100) > 0.01) widthsOk = false;
  });
  log(widthsOk, 'each odds bar segment widths total exactly 100%');
  const rings = Array.from(doc.querySelectorAll('[data-sustain-ring]'))
    .map(r => r.style.getPropertyValue('--pct').trim());
  log(rings.join(',') === '82,88,94', `sustainability rings set to 82,88,94 (${rings.join(',')})`);
  log(!!doc.querySelector('.reel__cell'), 'shop page carries a working reel preview');
  doc.querySelector('[data-tier-value="premium"]').click();
  await sleep(400);
  log(!Array.from(doc.querySelectorAll('.reel__cell')).some(c => c.dataset.rarity === 'everyday'),
      'shop reel follows the tier switcher');

  /* ==================================================================
     9. Homepage
     ================================================================== */
  mark('9. homepage');
  win = await loadFrame('/index.html');
  doc = win.document;
  await sleep(500);
  const lbs = doc.querySelector('[data-live-lbs]').textContent.replace(/,/g, '');
  log(Number(lbs) >= 12450, `impact counter reached 12,450 (${lbs})`);
  log(doc.querySelectorAll('.marquee__item').length === 16,
      `marquee duplicated for seamless loop (${doc.querySelectorAll('.marquee__item').length})`);
  log(doc.querySelectorAll('.reveal.is-in').length > 0,
      `scroll-reveal elements activated (${doc.querySelectorAll('.reveal.is-in').length})`);
  log(!!doc.querySelector('#try-the-reveal .reel__cell'), 'homepage carries a working reel');

  const form = doc.querySelector('[data-newsletter]');
  const email = form.querySelector('input[type="email"]');
  email.value = 'nope';
  form.dispatchEvent(new win.Event('submit', { cancelable: true, bubbles: true }));
  await sleep(150);
  log(form.querySelector('[data-form-msg]').dataset.state === 'err', 'invalid email rejected');
  email.value = 'a@b.co';
  form.dispatchEvent(new win.Event('submit', { cancelable: true, bubbles: true }));
  await sleep(150);
  log(form.querySelector('[data-form-msg]').dataset.state === 'ok', 'valid email accepted');

  /* ==================================================================
     10. Item lookbook
     ================================================================== */
  mark('10. lookbook');
  win = await loadFrame('/lookbook.html');
  doc = win.document;
  await sleep(500);
  log(doc.querySelectorAll('.item-tile').length === 200,
      `all 200 items rendered (${doc.querySelectorAll('.item-tile').length})`);
  log(win.ITEM_CATALOG.length === 200, `catalogue has 200 entries (${win.ITEM_CATALOG.length})`);
  log(new Set(win.ITEM_CATALOG.map(i => i.id)).size === 200, 'all item ids unique');
  log(new Set(win.ITEM_CATALOG.map(i => i.name)).size === 200, 'all item names unique');
  const validTags = ['rare', 'designer', 'statement', 'seasonal', 'everyday'];
  log(win.ITEM_CATALOG.every(i => validTags.includes(i.rarity)), 'every item tagged with a real rarity');
  const b = win.catalogBreadth();
  log(b.rare === 20 && b.designer === 30 && b.statement === 45 && b.seasonal === 45 && b.everyday === 60,
      `breadth 20/30/45/45/60 (${b.rare}/${b.designer}/${b.statement}/${b.seasonal}/${b.everyday})`);

  await sleep(500);
  const imgs = Array.from(doc.querySelectorAll('.item-tile__img')).slice(0, 24);
  log(imgs.filter(im => im.complete && im.naturalWidth === 0).length === 0, 'sprite files load');
  const frame = doc.querySelector('.item-tile__frame');
  log(frame && frame.getBoundingClientRect().width > 100,
      `sprite frame is full tile width, not collapsed (${frame && Math.round(frame.getBoundingClientRect().width)}px)`);
  log(doc.querySelector('.item-tile').getBoundingClientRect().width > 140,
      'tiles not squeezed by default figure margins');

  doc.querySelector('[data-filter-rarity] [data-rarity="rare"]').click();
  await sleep(250);
  log(doc.querySelectorAll('.item-tile').length === 20, 'rarity filter narrows to 20 Vintage Rare');
  log(Array.from(doc.querySelectorAll('.item-tile__frame')).every(f => f.dataset.rarity === 'rare'),
      'filtered grid contains only that tag');
  const catBtn = doc.querySelector('[data-filter-category] [data-category="outerwear"]');
  if (catBtn) {
    catBtn.click();
    await sleep(250);
    const n = doc.querySelectorAll('.item-tile').length;
    log(n > 0 && n < 20, `category filter composes with rarity (${n} items)`);
  }
  doc.querySelector('[data-filter-rarity] [data-rarity="all"]').click();
  doc.querySelector('[data-filter-category] [data-category="all"]').click();
  await sleep(250);
  log(doc.querySelectorAll('.item-tile').length === 200, 'filters reset to all 200');
  log(/not your chances|breadth, not/i.test(doc.body.textContent),
      'explicitly distinguishes catalogue breadth from draw odds');

  /* ==================================================================
     11. No trace of the retired wheel or card line
     ================================================================== */
  mark('11. removals');
  for (const page of ['/index.html', '/shop.html', '/box.html', '/faq.html', '/about.html', '/lookbook.html']) {
    win = await loadFrame(page);
    doc = win.document;
    await sleep(200);
    const html = doc.documentElement.innerHTML;
    const stale = ['data-wheel-', 'wheel.js', 'cards.html', 'card-catalog', 'reveal-toggle']
      .filter(n => html.includes(n));
    log(stale.length === 0, `${page} free of retired wheel/card markup${stale.length ? ' — found ' + stale.join(', ') : ''}`);
  }

  const failed = lines.filter(l => l.startsWith('FAIL')).length;
  lines.push('');
  lines.push(`TOTAL: ${lines.filter(l => l.startsWith('PASS')).length} passed, ${failed} failed`);
  out();
}

run().catch(e => { lines.push('HARNESS ERROR: ' + e.message + '\n' + e.stack); out(); });
</script>
</body>
</html>
